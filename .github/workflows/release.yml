name: Build Obsidian Plugin

on:
  pull_request:
    paths:
      - "manifest.json"
      - ".github/workflows/release.yml"
  push:
    branches:
      - "**"
    tags:
      - "*"
    paths:
      - "manifest.json"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing version tag to publish"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build plugin
        run: npm run build
      
      - name: Create release package
        run: |
          # Get version from manifest.json
          VERSION=$(jq -r '.version' manifest.json)
          
          # Create dist directory
          mkdir -p dist
          
          # Copy plugin files to dist
          cp main.js manifest.json styles.css dist/
          
          # Create zip archive
          cd dist
          zip -r ../clear-unused-attachment-${VERSION}.zip .
          cd ..

      - name: Upload build artifact
        if: ${{ github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: plugin-build-${{ github.sha }}
          path: clear-unused-attachment-*.zip
          if-no-files-found: error
      
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        id: create_release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          name: Release ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          draft: false
          prerelease: false
          files: |
            clear-unused-attachment-*.zip
            main.js
            manifest.json
            styles.css
