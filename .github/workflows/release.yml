name: Build Obsidian Plugin

on:
  push:
    branches:
      - main
    paths:
      - "manifest.json"
      - "package.json"
      - ".github/workflows/release.yml"
      - "src/**"
      - "main.js"
      - "styles.css"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing version tag to publish"
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Read plugin version
        id: version
        shell: bash
        run: echo "version=$(jq -r '.version' manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Check if release tag already exists
        id: tag_check
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --tags origin "refs/tags/${VERSION}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag for version bump
        if: github.event_name == 'push' && steps.tag_check.outputs.exists == 'false'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${VERSION}"
          git push origin "${VERSION}"

      - name: Create release package
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          cp main.js manifest.json styles.css dist/
          cd dist
          zip -r "../clear-unused-attachment-${VERSION}.zip" .
          cd ..

      - name: Create Release
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && steps.tag_check.outputs.exists == 'false')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && (inputs.release_tag != '' && inputs.release_tag || steps.version.outputs.version) || steps.version.outputs.version }}
          name: Release ${{ github.event_name == 'workflow_dispatch' && (inputs.release_tag != '' && inputs.release_tag || steps.version.outputs.version) || steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            clear-unused-attachment-*.zip
            main.js
            manifest.json
            styles.css
