name: Build Obsidian Plugin

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing version tag to publish"
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Read plugin version
        id: version
        shell: bash
        run: echo "version=$(jq -r '.version' manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Create release package
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          cp main.js manifest.json styles.css dist/
          cd dist
          zip -r "../clear-unused-attachment-${VERSION}.zip" .
          cd ..

      - name: Create Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || steps.version.outputs.version }}
          name: Release ${{ inputs.release_tag != '' && inputs.release_tag || steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            clear-unused-attachment-*.zip
            main.js
            manifest.json
            styles.css
